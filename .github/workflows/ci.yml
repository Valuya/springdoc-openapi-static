name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: Boot ${{ matrix.spring-boot }}, springdoc ${{ matrix.springdoc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Every springdoc line next to the Spring Boot it is built on
      matrix:
        include:
          - spring-boot: 4.0.9
            springdoc: 3.0.3
          - spring-boot: 4.1.2
            springdoc: 3.1.1
          - spring-boot: 4.1.2
            springdoc: 3.2.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # install, not verify: the plugin's integration test resolves the plugin from the local repository
      - name: Build, unit and integration tests
        run: mvn -B install -Dspring-boot.version=${{ matrix.spring-boot }} -Dspringdoc.version=${{ matrix.springdoc }}
