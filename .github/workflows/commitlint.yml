name: commitlint

on:
  pull_request:

permissions:
  contents: read

# The commit types decide the released version (.releaserc.json), so a
# message that isn't a Conventional Commit would release nothing, or the
# wrong number.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install commitlint
        run: npm ci

      - name: Lint commits in PR
        run: |
          npx commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose
