name: Publish to Maven Central

# Publishes the library and the Maven plugin through the Central Portal.
#
# Secrets (organization secrets, which this repository must be one of the selected repositories of):
#   GPG_PRIVATE_KEY, GPG_PASSPHRASE    signing key
#   CENTRAL_USERNAME, CENTRAL_PASSWORD Central Portal token

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Version to publish, e.g. 0.1.0
        required: true
      auto_publish:
        description: Publish at once (true), or stage it for a release by hand in the Central Portal (false)
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Resolve the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "release=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "auto_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=${{ inputs.release_version }}" >> "$GITHUB_OUTPUT"
            echo "auto_publish=${{ inputs.auto_publish }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set the version
        run: mvn -B -q versions:set -DnewVersion=${{ steps.version.outputs.release }} -DgenerateBackupPoms=false

      # waitUntil=published makes a green run mean the artifacts resolve, not just that an upload was accepted
      - name: Build, test, sign and publish
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: >
          mvn -B deploy -Prelease
          -Dcentral.autoPublish=${{ steps.version.outputs.auto_publish }}
          -Dcentral.waitUntil=${{ steps.version.outputs.auto_publish == 'true' && 'published' || 'validated' }}
